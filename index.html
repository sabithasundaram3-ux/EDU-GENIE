<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <<<div class="logo">🧞 EduGenie</div> 
        <p class="subtitle">Your AI-Powered Learning Assistant</p>

        <!-- Interactive Prompt Form -->
        <form action="/process" method="POST" class="prompt-form">
            <div class="prompt-container">
                <input 
                    type="text" 
                    id="user_query"
                    name="user_query" 
                    placeholder="Ask EduGenie anything or paste a topic..." 
                    required 
                    autocomplete="off"
                />
                <button type="submit">Generate ✨</button>
            </div>
        </form>

       <!-- AI Output Display -->
{% if result %}
<div class="result-card">
    <h3>Response for: "{{ query }}"</h3>
    
    <!-- Render interactive HTML generated by Gemini -->
    <div class="quiz-container">
        {{ result | safe }}
    </div>
</div>
{% endif %} 
        <!-- Interactive Feature Cards -->
        <div class="features">
            <div class="card" onclick="setPrompt('Explain ')">
                <h3>💡 Explain</h3>
                <p>Understand difficult topics in simple words.</p>
            </div>

            <div class="card" onclick="setPrompt('Generate a quiz about ')">
                <h3>📜 Quiz</h3>
                <p>Generate quizzes to test your knowledge.</p>
            </div>

            <div class="card" onclick="setPrompt('Summarize ')">
                <h3>📚 Summarize</h3>
                <p>Get quick and useful study summaries.</p>
            </div>
        </div>
    </div>

    <!-- Quick JavaScript to fill the prompt when clicking cards -->
    <script>
        function setPrompt(prefix) {
            const input = document.getElementById('user_query');
            input.value = prefix;
            input.focus();
        }
    </script>

</body>
</html>
